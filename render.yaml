services:
  - type: web
    name: bps-fresh-mills
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://bpsfreshmills.in
      - key: ADMIN_SECRET_PIN
        value: 8899
      - key: JWT_SECRET
        generateValue: true
